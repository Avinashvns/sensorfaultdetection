<!DOCTYPE html>
<html>
<head>
    <title>Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    
</head>

<body>

<!-- 🔥 Navbar -->
<div class="navbar">
    <div class="logo">⚡ Sensor ML</div>
    <a href="/">
        <button class="nav-btn">🏠 Home</button>
    </a>
</div>

<div class="container">

    <div class="card">

        <h1>🔍 Fault Prediction</h1>

        <p>Upload CSV file to detect faults using trained ML model</p>

        <form action="/predict" method="post" enctype="multipart/form-data">

            <div class="dropzone">
                <div class="upload-text">📂 Click or Drop CSV file</div>
                <input type="file" id="fileInput" class="upload-input" name="file" accept=".csv" required>
                <div id="fileName" class="file-name"></div>
            </div>

            <button type="submit" id="uploadBtn" class="btn btn-upload" disabled>
                Run Prediction
            </button>

        </form>

    </div>

</div>

<script>
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const uploadBtn = document.getElementById("uploadBtn");

    uploadBtn.disabled = true; // default disabled

    fileInput.addEventListener("change", function () {
        if (this.files.length > 0) {
            fileName.innerText = "📄 " + this.files[0].name;
            uploadBtn.disabled = false;
        } else {
            fileName.innerText = "";
            uploadBtn.disabled = true;
        }
    });
</script>

</body>
</html>
